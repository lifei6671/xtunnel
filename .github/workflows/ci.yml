  alpha-release-oci:
    if: github.event_name == 'workflow_dispatch' && inputs.release_gate
    name: Alpha release OCI manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup latest Go 1.27.x
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false

      - name: Setup Node 24.19.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.19.0'
          check-latest: false
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the embedded web assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm --version)" = '11.17.0'
          npm --prefix web ci
          npm --prefix web run check
          npm --prefix web run build

      - name: Build and verify multi-architecture OCI layouts
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          ./tools/check-go-version.sh
          result_dir="$RUNNER_TEMP/m7-10-release-oci"
          GITHUB_SHA="$GITHUB_SHA" ./tests/release/run-m7-10.sh -o "$result_dir"
          (
            cd "$result_dir"
            sha256sum -c artifact-sha256.txt
          )

      - name: Upload verified Alpha OCI candidate evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m7-10-candidate-oci-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m7-10-release-oci
          if-no-files-found: error
          retention-days: 14

  alpha-release-gate:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.release_gate
    name: Alpha release gate
    runs-on: ubuntu-24.04
    needs:
      - verify
      - privileged-network-chaos
      - windows-agent
      - windows-arm64-agent
      - alpha-release-chaos
      - alpha-release-analysis
      - alpha-release-scale
      - alpha-release-oci

    steps:
      - name: Require every Alpha producer to pass
        shell: bash
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          NETWORK_RESULT: ${{ needs.privileged-network-chaos.result }}
          WINDOWS_RESULT: ${{ needs.windows-agent.result }}
          WINDOWS_ARM64_RESULT: ${{ needs.windows-arm64-agent.result }}
          CHAOS_RESULT: ${{ needs.alpha-release-chaos.result }}
          ANALYSIS_RESULT: ${{ needs.alpha-release-analysis.result }}
          SCALE_RESULT: ${{ needs.alpha-release-scale.result }}
          OCI_RESULT: ${{ needs.alpha-release-oci.result }}
        run: |
          set -euo pipefail
          for result in "$VERIFY_RESULT" "$NETWORK_RESULT" "$WINDOWS_RESULT" \
            "$WINDOWS_ARM64_RESULT" "$CHAOS_RESULT" "$ANALYSIS_RESULT" "$SCALE_RESULT" \
            "$OCI_RESULT"; do
            test "$result" = success
          done
