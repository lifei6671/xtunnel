name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_gate:
        description: Run the Alpha release-only OCI and artifact gate
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '30 18 * * *'

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  # Fixed pre-release candidate baseline. The repository has no official release tag yet.
  M7_PREVIOUS_CANDIDATE_COMMIT: 36bcce33f97af7e8083196d9204b46918c743f65

jobs:
  verify:
    name: verify (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      BROWSER_E2E_CADDY_IMAGE: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
      BROWSER_E2E_NGINX_IMAGE: nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    strategy:
      fail-fast: false
      matrix:
        include:
          # 使用原生 Linux arm64 Runner；QEMU 或仅交叉编译不能作为 arm64 进程 Smoke 证据。
          - arch: amd64
            runner: ubuntu-24.04
            uname_arch: x86_64
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            uname_arch: aarch64
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup latest Go 1.27.x
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false

      - name: Setup Node 24.19.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.19.0'
          check-latest: false
          cache: npm
          cache-dependency-path: |
            tools/openapi-ts/package-lock.json
            web/package-lock.json

      - name: Verify runner and supported toolchains
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.uname_arch }}"
          test "$(go env GOTOOLCHAIN)" = 'local'
          test "$(node --version)" = 'v24.19.0'
          test "$(npm --version)" = '11.17.0'
          ./tools/check-go-version.sh

      - name: Verify Proto toolchain and wrapper path
        shell: bash
        run: |
          set -euo pipefail
          ./tools/bootstrap-proto.sh
          ./tools/proto.sh lint
          ./tools/proto.sh breaking
          ./tools/proto.sh generate-check

      - name: Install Node dependencies from locked manifests
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix tools/openapi-ts ci
          npm --prefix web ci

      - name: Install locked Playwright Chromium and system dependencies
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix web exec -- playwright install --with-deps chromium

      - name: Verify OpenAPI toolchain and wrapper path
        shell: bash
        run: |
          set -euo pipefail
          ./tools/bootstrap-openapi.sh
          ./tools/openapi.sh validate
          ./tools/openapi.sh breaking
          ./tools/openapi.sh generate-check
          ./tools/test-openapi.sh

      - name: Build the embedded web assets
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix web run check
          npm --prefix web run build

      - name: Test Go modules and build both processes
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          (
            cd tools
            go mod verify
            go build -mod=readonly ./...
          )
          go test ./...
          go test -race -count=1 -timeout 600s ./...
          go vet ./...
          build_version="v0.1.0-ci.${GITHUB_SHA}"
          go build -ldflags="-X github.com/lifei6671/xtunnel/internal/buildinfo.version=$build_version" ./cmd/server ./cmd/agent

      - name: Run M7 protocol and parser short fuzz
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          result_dir="$RUNNER_TEMP/m7-06-fuzz-${{ matrix.arch }}"
          sh ./tests/fuzz/run-m7-06.sh -m smoke -o "$result_dir"
          test -s "$result_dir/artifact-sha256.txt"
          sha256sum -c "$result_dir/artifact-sha256.txt"
          sha256sum "$result_dir/artifact-sha256.txt"

      - name: Run native M7 resource leak full
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          result_dir="$RUNNER_TEMP/m7-07-leak-${{ matrix.arch }}"
          sh ./tests/leak/run-m7-07.sh -m full -o "$result_dir"
          test -s "$result_dir/artifact-sha256.txt"
          (
            cd "$result_dir"
            sha256sum -c artifact-sha256.txt
            sha256sum artifact-sha256.txt
          )

      - name: Run native M4 product data plane E2E
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          go test -count=1 -timeout 180s ./internal/server/bootstrap \
            -run '^TestProductDataPlaneEndToEnd$'

      - name: Run native M7 release backup restore reconnect matrix
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          release_test="$RUNNER_TEMP/m7-09-release-${{ matrix.arch }}.test"
          go test -c -o "$release_test" ./internal/server/bootstrap
          sudo -- "$release_test" \
            -test.v \
            -test.count=1 \
            -test.timeout=180s \
            -test.run '^TestM7ReleaseBackupMigrationRestoreAgentReconnect$'

      - name: Run native M6 Prometheus metrics blackbox
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          go test -count=1 -timeout 120s ./internal/server/bootstrap \
            -run '^TestMetricsEndpoint(EndToEnd|BindFailureRollsBackBootstrap)$'

      - name: Run native M6 OpenTelemetry trace blackbox
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          go test -count=1 -timeout 120s ./internal/server/bootstrap \
            -run '^TestOpenTelemetryTraceEndToEnd$'

      - name: Run native M6 Usage aggregation blackbox
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          go test -count=1 -timeout 120s ./internal/server/bootstrap \
            -run '^TestUsageAggregationEndToEnd$'

      - name: Run native M6 Error status observability blackbox
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          go test -count=1 -timeout 120s ./internal/server/bootstrap \
            -run '^TestErrorStatusObservabilityEndToEnd$'

      - name: Run native M6 Agent connectivity diagnostic blackbox
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          go test -count=1 -timeout 120s ./internal/agent/gateway \
            -run '^TestDiagnose'
          go test -count=1 -timeout 120s ./internal/agent/bootstrap \
            -run '^TestExecuteDiagnose'

      - name: Run native M4 1 GiB streaming gate
        shell: bash
        timeout-minutes: 3
        env:
          XTUNNEL_RUN_LARGE_STREAM_TEST: '1'
        run: |
          set -euo pipefail
          go test -count=1 -timeout 120s ./internal/server/httpingress \
            -run '^TestHandlerTransfersOneGiBInEachDirection$'

      - name: Run native Caddy and Nginx HTTPS ingress E2E
        shell: bash
        env:
          XTUNNEL_RUN_FRONT_PROXY_E2E: '1'
        run: |
          set -euo pipefail
          docker pull "$BROWSER_E2E_CADDY_IMAGE"
          docker pull "$BROWSER_E2E_NGINX_IMAGE"
          test "$(docker image inspect --format '{{.Architecture}}' "$BROWSER_E2E_CADDY_IMAGE")" = '${{ matrix.arch }}'
          test "$(docker image inspect --format '{{.Architecture}}' "$BROWSER_E2E_NGINX_IMAGE")" = '${{ matrix.arch }}'
          go test -count=1 -timeout 180s ./internal/server/httpingress \
            -run '^TestFrontProxyHTTPSAndWebSocketE2E$'

      - name: Run real Caddy and Nginx Browser E2E
        if: matrix.arch == 'amd64'
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          runtime_dir=/run/xtunnel
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$runtime_dir"
          cleanup_runtime_dir() {
            sudo rmdir "$runtime_dir"
          }
          trap cleanup_runtime_dir EXIT
          sudo prlimit --pid "$$" --nofile=1048576:1048576
          XTUNNEL_CADDY_IMAGE="$BROWSER_E2E_CADDY_IMAGE" \
            XTUNNEL_NGINX_IMAGE="$BROWSER_E2E_NGINX_IMAGE" \
            npm --prefix web run test:e2e

      - name: Run native OCI smoke tests
        shell: bash
        run: |
          set -euo pipefail
          ./deploy/docker/smoke.sh --target server --platform '${{ matrix.platform }}'
          ./deploy/docker/smoke.sh --target agent --platform '${{ matrix.platform }}'

          expect_version_rejected() {
            name=$1
            shift
            log="$RUNNER_TEMP/oci-version-$name.log"
            if docker buildx build \
              --pull \
              --progress plain \
              --platform '${{ matrix.platform }}' \
              --target versioned-go-source \
              --file deploy/docker/Dockerfile \
              "$@" \
              . >"$log" 2>&1; then
              printf 'OCI build unexpectedly accepted %s XTUNNEL_VERSION\n' "$name" >&2
              return 1
            fi
            grep -F 'XTUNNEL_VERSION must be 1-64 characters' "$log" >/dev/null
          }
          expect_version_rejected missing
          expect_version_rejected invalid --build-arg 'XTUNNEL_VERSION=v0.1.0 invalid'
          expect_version_rejected too-long --build-arg 'XTUNNEL_VERSION=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'

      - name: Run native Compose dual-stack build and runtime smoke
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          ./deploy/docker/dualstack-smoke.sh --platform '${{ matrix.platform }}'

      - name: Run native M6 Operations and M7 release systemd smoke
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          candidate_commit="$M7_PREVIOUS_CANDIDATE_COMMIT"
          candidate_source="$RUNNER_TEMP/m7-09-candidate-source"
          previous_server_binary="$RUNNER_TEMP/xtunnel-server-previous"
          previous_agent_binary="$RUNNER_TEMP/xtunnel-agent-previous"
          server_binary="$RUNNER_TEMP/xtunnel-server"
          agent_binary="$RUNNER_TEMP/xtunnel-agent"

          git fetch --no-tags --depth=1 origin "$candidate_commit"
          test "$(git rev-parse "$candidate_commit^{commit}")" = "$candidate_commit"
          mkdir "$candidate_source"
          git archive "$candidate_commit" | tar -x -C "$candidate_source"
          npm --prefix "$candidate_source/web" ci
          npm --prefix "$candidate_source/web" run build
          (
            cd "$candidate_source"
            "$GITHUB_WORKSPACE/tools/check-go-version.sh"
            go mod verify
            candidate_version="v0.1.0-candidate.$candidate_commit"
            candidate_ldflags="-X github.com/lifei6671/xtunnel/internal/buildinfo.version=$candidate_version"
            go build -trimpath -ldflags="$candidate_ldflags" -o "$previous_server_binary" ./cmd/server
            go build -trimpath -ldflags="$candidate_ldflags" -o "$previous_agent_binary" ./cmd/agent
          )

          current_version="v0.1.0-ci.${GITHUB_SHA}"
          current_ldflags="-X github.com/lifei6671/xtunnel/internal/buildinfo.version=$current_version"
          go build -trimpath -ldflags="$current_ldflags" -o "$server_binary" ./cmd/server
          go build -trimpath -ldflags="$current_ldflags" -o "$agent_binary" ./cmd/agent
          sudo ./deploy/systemd/smoke.sh \
            --previous-server-binary "$previous_server_binary" \
            --previous-agent-binary "$previous_agent_binary" \
            --server-binary "$server_binary" \
            --agent-binary "$agent_binary"

      - name: Verify generated files remain clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

  privileged-network-chaos:
    if: github.event_name != 'pull_request'
    name: privileged network chaos (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            uname_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            uname_arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup latest Go 1.27.x
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false

      - name: Setup Node 24.19.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.19.0'
          check-latest: false
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the embedded web assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.19.0'
          test "$(npm --version)" = '11.17.0'
          npm --prefix web ci
          npm --prefix web run check
          npm --prefix web run build

      - name: Install privileged network tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends iproute2 nftables

      - name: Run native M7 privileged network chaos full
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.uname_arch }}'
          test "$(go env GOTOOLCHAIN)" = 'local'
          ./tools/check-go-version.sh

          artifact_root="$RUNNER_TEMP/m7-08-network-${{ matrix.arch }}"
          result_dir="$artifact_root/result"
          mkdir -p "$artifact_root"
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'arch=%s\n' '${{ matrix.arch }}'
            printf 'uname=%s\n' "$(uname -a)"
            printf 'go_version=%s\n' "$(go env GOVERSION)"
            printf 'go_toolchain=%s\n' "$(go env GOTOOLCHAIN)"
            printf 'ip_version=%s\n' "$(ip -Version 2>&1)"
            printf 'tc_version=%s\n' "$(tc -Version 2>&1)"
            printf 'nft_version=%s\n' "$(nft --version 2>&1)"
            printf 'ss_version=%s\n' "$(ss -V 2>&1)"
          } >"$artifact_root/runner-preflight.txt"

          cleanup_artifact_ownership() {
            if sudo test -d "$result_dir"; then
              sudo chown -R "$(id -u):$(id -g)" "$result_dir"
            fi
          }
          trap cleanup_artifact_ownership EXIT

          go_bin_dir=$(dirname "$(command -v go)")
          sudo env \
            PATH="$go_bin_dir:/usr/sbin:/usr/bin:/sbin:/bin" \
            GOTOOLCHAIN=local \
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=safe.directory \
            GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            sh ./tests/chaos/run-m7-08.sh \
              -m full \
              -o "$result_dir" \
            >"$artifact_root/runner.log" 2>&1

          # 原始日志只有在秘密扫描通过后才允许进入 Actions Artifact；扫描失败时
          # scanner 仅报告规则与路径，不把可能含凭据的原文回显到 CI 控制台。
          go run ./tests/release/secretscan -path "$artifact_root" >/dev/null

          test -s "$result_dir/artifact-sha256.txt"
          (
            cd "$result_dir"
            sha256sum -c artifact-sha256.txt
            sha256sum artifact-sha256.txt
          )

      - name: Upload M7 privileged network chaos artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m7-08-network-${{ matrix.arch }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m7-08-network-${{ matrix.arch }}
          if-no-files-found: warn
          retention-days: 14

  windows-agent:
    name: Windows amd64 Agent and Server
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup latest Go 1.27.x
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false

      - name: Setup Node 24.19.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.19.0'
          check-latest: false
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify supported toolchains
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $runnerArchitecture = '${{ runner.arch }}'
          $runtimeArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($runnerArchitecture -ne 'X64') {
            throw "GitHub runner architecture must be X64, got $runnerArchitecture"
          }
          if ($runtimeArchitecture -ne 'X64') {
            throw "Windows runner architecture must be X64, got $runtimeArchitecture"
          }
          if ((go env GOOS) -ne 'windows') {
            throw 'Go target OS must be windows'
          }
          if ((go env GOHOSTARCH) -ne 'amd64') {
            throw 'Go host architecture must be amd64'
          }
          if ((go env GOARCH) -ne 'amd64') {
            throw 'Go target architecture must be amd64'
          }
          if ((go env GOTOOLCHAIN) -ne 'local') {
            throw 'GOTOOLCHAIN must be local'
          }
          if ((node --version) -ne 'v24.19.0') {
            throw 'Node version must be v24.19.0'
          }
          if ((npm --version) -ne '11.17.0') {
            throw 'npm version must be 11.17.0'
          }
          ./tools/check-go-version.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Go version check failed' }

      - name: Build the embedded web assets
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          npm --prefix web ci
          if ($LASTEXITCODE -ne 0) { throw 'web npm ci failed' }
          npm --prefix web run check
          if ($LASTEXITCODE -ne 0) { throw 'web check failed' }
          npm --prefix web run build
          if ($LASTEXITCODE -ne 0) { throw 'web build failed' }

      - name: Test Go modules and build Agent
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'go mod verify failed' }
          go test ./internal/agent/... ./cmd/agent
          if ($LASTEXITCODE -ne 0) { throw 'Agent tests failed' }
          go test -race ./internal/agent/bootstrap ./internal/agent/service
          if ($LASTEXITCODE -ne 0) { throw 'Agent race tests failed' }
          go vet ./internal/agent/... ./cmd/agent
          if ($LASTEXITCODE -ne 0) { throw 'Agent vet failed' }
          $agentPath = Join-Path $env:RUNNER_TEMP 'xtunnel-agent.exe'
          $gateHelperPath = Join-Path $env:RUNNER_TEMP 'xtunnel-scm-gate-helper.exe'
          $buildVersion = "v0.1.0-ci.$env:GITHUB_SHA"
          $ldflags = "-X github.com/lifei6671/xtunnel/internal/buildinfo.version=$buildVersion"
          go build -trimpath -ldflags $ldflags -o $agentPath ./cmd/agent
          if ($LASTEXITCODE -ne 0) { throw 'Agent build failed' }
          go build -trimpath -o $gateHelperPath ./tests/windows-scm-gate
          if ($LASTEXITCODE -ne 0) { throw 'Windows SCM Gate Helper build failed' }

      - name: Test vet and build Windows amd64 Server
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          go test -count=1 -timeout 180s ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows amd64 full repository tests failed' }
          go test -v -race -count=1 -timeout 180s ./internal/server/datadir ./internal/server/externallock ./internal/server/winsecurity ./internal/server/bootstrap
          if ($LASTEXITCODE -ne 0) { throw 'Windows amd64 Server lifecycle and security race tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows amd64 full repository vet failed' }

          $serverPath = Join-Path $env:RUNNER_TEMP 'xtunnel-server.exe'
          $buildVersion = "v0.1.0-ci.$env:GITHUB_SHA"
          $ldflags = "-X github.com/lifei6671/xtunnel/internal/buildinfo.version=$buildVersion"
          go build -trimpath -ldflags $ldflags -o $serverPath ./cmd/server
          if ($LASTEXITCODE -ne 0) { throw 'Windows amd64 Server build failed' }

          $ErrorActionPreference = 'Continue'
          $serverHelp = & $serverPath --help 2>&1
          $serverHelpExitCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($serverHelpExitCode -ne 0) { throw 'Windows amd64 Server help failed' }
          if (($serverHelp -join "`n") -notmatch 'run and maintain XTunnel Server') {
            throw 'Windows amd64 Server help output is incomplete'
          }
          $serverToolchain = go version $serverPath
          if ($LASTEXITCODE -ne 0) { throw 'Windows amd64 Server toolchain readback failed' }
          if (($serverToolchain -join "`n") -notmatch 'go1\.27\.[1-9]\d*') {
            throw 'Windows amd64 Server toolchain readback must contain Go 1.27.x'
          }

      - name: Cross-build Windows arm64 Agent and Server
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $env:GOOS = 'windows'
          $env:GOARCH = 'arm64'
          $env:CGO_ENABLED = '0'
          $agentPath = Join-Path $env:RUNNER_TEMP 'xtunnel-agent-arm64.exe'
          $bootstrapTest = Join-Path $env:RUNNER_TEMP 'agent-bootstrap-arm64.test.exe'
          $serviceTest = Join-Path $env:RUNNER_TEMP 'agent-service-arm64.test.exe'
          $gateHelperPath = Join-Path $env:RUNNER_TEMP 'xtunnel-scm-gate-helper-arm64.exe'
          $serverPath = Join-Path $env:RUNNER_TEMP 'xtunnel-server-arm64.exe'
          $buildVersion = "v0.1.0-ci.$env:GITHUB_SHA"
          $ldflags = "-X github.com/lifei6671/xtunnel/internal/buildinfo.version=$buildVersion"
          go build -trimpath -ldflags $ldflags -o $agentPath ./cmd/agent
          if ($LASTEXITCODE -ne 0) { throw 'Windows arm64 Agent build failed' }
          go test -c -o $bootstrapTest ./internal/agent/bootstrap
          if ($LASTEXITCODE -ne 0) { throw 'Windows arm64 bootstrap test compile failed' }
          go test -c -o $serviceTest ./internal/agent/service
          if ($LASTEXITCODE -ne 0) { throw 'Windows arm64 service test compile failed' }
          go build -trimpath -o $gateHelperPath ./tests/windows-scm-gate
          if ($LASTEXITCODE -ne 0) { throw 'Windows arm64 SCM Gate Helper build failed' }
          go build -trimpath -ldflags $ldflags -o $serverPath ./cmd/server
          if ($LASTEXITCODE -ne 0) { throw 'Windows arm64 Server build failed' }

          $serverTestPackages = @(
            @{ Package = './configs'; Output = 'server-config-example-arm64.test.exe' }
            @{ Package = './internal/server/config'; Output = 'server-config-arm64.test.exe' }
            @{ Package = './internal/server/datadir'; Output = 'server-datadir-arm64.test.exe' }
            @{ Package = './internal/server/durableops'; Output = 'server-durableops-arm64.test.exe' }
            @{ Package = './internal/server/externallock'; Output = 'server-externallock-arm64.test.exe' }
            @{ Package = './internal/server/limits'; Output = 'server-limits-arm64.test.exe' }
            @{ Package = './internal/server/service'; Output = 'server-service-arm64.test.exe' }
            @{ Package = './internal/server/bootstrap'; Output = 'server-bootstrap-arm64.test.exe' }
          )
          foreach ($serverTestPackage in $serverTestPackages) {
            $testPath = Join-Path $env:RUNNER_TEMP $serverTestPackage.Output
            go test -c -o $testPath $serverTestPackage.Package
            if ($LASTEXITCODE -ne 0) {
              throw "Windows arm64 test compile failed for $($serverTestPackage.Package)"
            }
          }

      - name: Run Windows M6 Stop timeout diagnostic unit gate
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          go test ./internal/agent/service -run '^TestWindowsServiceHandlerFailsWhenRuntimeDoesNotStop$' -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Windows Stop timeout diagnostic unit gate failed' }

      - name: Run Windows M6 SCM and M7 candidate upgrade gate
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $candidateCommit = $env:M7_PREVIOUS_CANDIDATE_COMMIT
          $candidateArchive = Join-Path $env:RUNNER_TEMP 'm7-09-candidate.zip'
          $candidateSource = Join-Path $env:RUNNER_TEMP 'm7-09-candidate-source'
          $previousAgentPath = Join-Path $env:RUNNER_TEMP 'xtunnel-agent-previous.exe'
          $agentPath = Join-Path $env:RUNNER_TEMP 'xtunnel-agent.exe'
          $gateHelperPath = Join-Path $env:RUNNER_TEMP 'xtunnel-scm-gate-helper.exe'

          git fetch --no-tags --depth=1 origin $candidateCommit
          if ($LASTEXITCODE -ne 0) { throw 'candidate commit fetch failed' }
          $resolvedCandidate = git rev-parse "$candidateCommit^{commit}"
          if (($LASTEXITCODE -ne 0) -or ($resolvedCandidate -ne $candidateCommit)) {
            throw 'candidate commit identity verification failed'
          }
          git archive --format=zip -o $candidateArchive $candidateCommit
          if ($LASTEXITCODE -ne 0) { throw 'candidate source archive failed' }
          Expand-Archive -LiteralPath $candidateArchive -DestinationPath $candidateSource
          Push-Location $candidateSource
          try {
            go mod verify
            if ($LASTEXITCODE -ne 0) { throw 'candidate go mod verify failed' }
            $candidateVersion = "v0.1.0-candidate.$candidateCommit"
            $candidateLdflags = "-X github.com/lifei6671/xtunnel/internal/buildinfo.version=$candidateVersion"
            go build -trimpath -ldflags $candidateLdflags -o $previousAgentPath ./cmd/agent
            if ($LASTEXITCODE -ne 0) { throw 'candidate Agent build failed' }
          }
          finally {
            Pop-Location
          }

          ./deploy/windows/smoke.ps1 -PreviousAgentPath $previousAgentPath `
            -AgentPath $agentPath -GateHelperPath $gateHelperPath

      - name: Verify Windows Server candidate product gate
        shell: powershell
        timeout-minutes: 12
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          ./tools/check-go-version.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows product gate toolchain check failed' }
          $env:XTUNNEL_WINDOWS_SERVER_GATE = '1'
          $env:XTUNNEL_SERVER_BINARY = Join-Path $env:RUNNER_TEMP 'xtunnel-server.exe'
          $env:XTUNNEL_AGENT_BINARY = Join-Path $env:RUNNER_TEMP 'xtunnel-agent.exe'
          $env:XTUNNEL_CANDIDATE_COMMIT = $env:GITHUB_SHA
          $env:XTUNNEL_PRODUCT_REPORT = Join-Path $env:RUNNER_TEMP 'm8-05-product.json'
          try {
            go test -v -count=1 -timeout 600s ./tests/windows-server-gate -run '^TestWindowsServerProductGate$'
            if ($LASTEXITCODE -ne 0) { throw 'Windows Server candidate product gate failed' }
          } finally {
            Remove-Item Env:\XTUNNEL_WINDOWS_SERVER_GATE
            Remove-Item Env:\XTUNNEL_SERVER_BINARY
            Remove-Item Env:\XTUNNEL_AGENT_BINARY
            Remove-Item Env:\XTUNNEL_CANDIDATE_COMMIT
            Remove-Item Env:\XTUNNEL_PRODUCT_REPORT
          }

      - name: Verify Windows Server SCM and Service SID isolation
        shell: powershell
        timeout-minutes: 8
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          ./tools/check-go-version.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows Server toolchain check failed' }
          $serverPath = Join-Path $env:RUNNER_TEMP 'xtunnel-server.exe'
          $diagnosticPath = Join-Path $env:RUNNER_TEMP 'xtunnel-server-startup-diagnostic.exe'
          go test -c -o $diagnosticPath ./internal/server/bootstrap
          if ($LASTEXITCODE -ne 0) { throw 'Windows Server diagnostic helper build failed' }
          ./deploy/windows-server/smoke.ps1 -ServerPath $serverPath -ConfigPath ./configs/server.windows.example.yaml -DiagnosticPath $diagnosticPath
          $env:XTUNNEL_SERVER_SCM_SECURITY_TEST = '1'
          try {
            go test -v -count=1 -timeout 180s ./internal/server/winsecurity -run '^TestServiceTokenIsolation$'
            if ($LASTEXITCODE -ne 0) { throw 'Windows Server Service SID isolation failed' }
          } finally {
            Remove-Item Env:\XTUNNEL_SERVER_SCM_SECURITY_TEST
          }

      - name: Verify Windows amd64 candidate artifact
        shell: powershell
        timeout-minutes: 5
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          ./tools/check-go-version.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows artifact toolchain check failed' }
          $serverPath = Join-Path $env:RUNNER_TEMP 'xtunnel-server.exe'
          $productReport = Join-Path $env:RUNNER_TEMP 'm8-05-product.json'
          $outputPath = Join-Path $env:RUNNER_TEMP 'm8-05-windows-candidate'
          go run ./tests/release/windowsverify -server $serverPath -commit $env:GITHUB_SHA -product-report $productReport -output $outputPath
          if ($LASTEXITCODE -ne 0) { throw 'Windows candidate artifact verification failed' }

      - name: Upload verified Windows amd64 candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m8-05-windows-amd64-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m8-05-windows-candidate
          if-no-files-found: error
          retention-days: 14

      - name: Verify working tree remains clean
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          $status = git status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw 'git status failed' }
          if ($status) { throw "working tree is dirty after Windows verification`n$status" }

  windows-arm64-agent:
    name: Windows arm64 Agent runtime
    runs-on: windows-11-arm
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup latest Go 1.27.x
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false

      - name: Setup Node 24.19.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.19.0'
          check-latest: false
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify native arm64 runner and supported Go toolchain
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $runnerArchitecture = '${{ runner.arch }}'
          $runtimeArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($runnerArchitecture -ne 'ARM64') {
            throw "GitHub runner architecture must be ARM64, got $runnerArchitecture"
          }
          if ($runtimeArchitecture -ne 'Arm64') {
            throw "Windows runner architecture must be Arm64, got $runtimeArchitecture"
          }
          if ((go env GOOS) -ne 'windows') {
            throw 'Go target OS must be windows'
          }
          if ((go env GOHOSTARCH) -ne 'arm64') {
            throw 'Go host architecture must be arm64'
          }
          if ((go env GOARCH) -ne 'arm64') {
            throw 'Go target architecture must be arm64'
          }
          if ((go env GOTOOLCHAIN) -ne 'local') {
            throw 'GOTOOLCHAIN must be local'
          }
          if ((go env CGO_ENABLED) -ne '0') {
            throw 'CGO_ENABLED must be 0'
          }
          if ((node --version) -ne 'v24.19.0') {
            throw 'Node version must be v24.19.0'
          }
          if ((npm --version) -ne '11.17.0') {
            throw 'npm version must be 11.17.0'
          }
          ./tools/check-go-version.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Go version check failed' }

      - name: Build the embedded web assets
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          npm --prefix web ci
          if ($LASTEXITCODE -ne 0) { throw 'web npm ci failed' }
          npm --prefix web run check
          if ($LASTEXITCODE -ne 0) { throw 'web check failed' }
          npm --prefix web run build
          if ($LASTEXITCODE -ne 0) { throw 'web build failed' }

      - name: Run native arm64 Bootstrap and DPAPI contract tests
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'go mod verify failed' }

          go test -v -count=1 -timeout 60s ./internal/agent/bootstrap `
            -run '^(TestResolveTokenSourcesAndPrecedence|TestRunWaitsForContextCancellationWithoutLeakingToken)$'
          if ($LASTEXITCODE -ne 0) { throw 'native Windows arm64 Bootstrap contract tests failed' }

          go test -v -count=1 -timeout 60s ./internal/agent/service `
            -run '^(TestWindowsDPAPIRoundTrip|TestLoadWindowsCredentialFile|TestResolveWindowsServiceTokenPrecedence)$'
          if ($LASTEXITCODE -ne 0) { throw 'native Windows arm64 DPAPI contract tests failed' }

      - name: Build and read Windows arm64 Server baseline
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          go test -count=1 -timeout 180s ./configs
          if ($LASTEXITCODE -ne 0) { throw 'native Windows arm64 Server config example tests failed' }
          go test -count=1 -timeout 180s ./internal/server/datadir ./internal/server/externallock
          if ($LASTEXITCODE -ne 0) { throw 'native Windows arm64 M8-02 target and external lock tests failed' }
          go test -count=1 -timeout 180s ./internal/server/bootstrap `
            -run '^TestWindowsOpenServerStorageLocksBeforeDurableState$'
          if ($LASTEXITCODE -ne 0) { throw 'native Windows arm64 M8-02 bootstrap ordering test failed' }

          $serverPath = Join-Path $env:RUNNER_TEMP 'xtunnel-server-arm64.exe'
          $buildVersion = "v0.1.0-ci.$env:GITHUB_SHA"
          $ldflags = "-X github.com/lifei6671/xtunnel/internal/buildinfo.version=$buildVersion"
          go build -trimpath -ldflags $ldflags -o $serverPath ./cmd/server
          if ($LASTEXITCODE -ne 0) { throw 'native Windows arm64 Server build failed' }

          $ErrorActionPreference = 'Continue'
          $serverHelp = & $serverPath --help 2>&1
          $serverHelpExitCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($serverHelpExitCode -ne 0) { throw 'native Windows arm64 Server help failed' }
          if (($serverHelp -join "`n") -notmatch 'run and maintain XTunnel Server') {
            throw 'native Windows arm64 Server help output is incomplete'
          }
          $serverToolchain = go version $serverPath
          if ($LASTEXITCODE -ne 0) { throw 'native Windows arm64 Server toolchain readback failed' }
          if (($serverToolchain -join "`n") -notmatch 'go1\.27\.[1-9]\d*') {
            throw 'native Windows arm64 Server toolchain readback must contain Go 1.27.x'
          }

      - name: Run native arm64 Agent SCM Token Bootstrap and Shutdown smoke
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $candidateCommit = $env:M7_PREVIOUS_CANDIDATE_COMMIT
          $candidateArchive = Join-Path $env:RUNNER_TEMP 'm7-09-candidate-arm64.zip'
          $candidateSource = Join-Path $env:RUNNER_TEMP 'm7-09-candidate-arm64-source'
          $previousAgentPath = Join-Path $env:RUNNER_TEMP 'xtunnel-agent-previous-arm64.exe'
          $agentPath = Join-Path $env:RUNNER_TEMP 'xtunnel-agent-arm64.exe'
          $gateHelperPath = Join-Path $env:RUNNER_TEMP 'xtunnel-scm-gate-helper-arm64.exe'
          $buildVersion = "v0.1.0-ci.$env:GITHUB_SHA"
          $ldflags = "-X github.com/lifei6671/xtunnel/internal/buildinfo.version=$buildVersion"

          go build -trimpath -ldflags $ldflags -o $agentPath ./cmd/agent
          if ($LASTEXITCODE -ne 0) { throw 'native Windows arm64 Agent build failed' }
          go build -trimpath -o $gateHelperPath ./tests/windows-scm-gate
          if ($LASTEXITCODE -ne 0) { throw 'native Windows arm64 SCM Gate Helper build failed' }

          git fetch --no-tags --depth=1 origin $candidateCommit
          if ($LASTEXITCODE -ne 0) { throw 'candidate commit fetch failed' }
          $resolvedCandidate = git rev-parse "$candidateCommit^{commit}"
          if (($LASTEXITCODE -ne 0) -or ($resolvedCandidate -ne $candidateCommit)) {
            throw 'candidate commit identity verification failed'
          }
          git archive --format=zip -o $candidateArchive $candidateCommit
          if ($LASTEXITCODE -ne 0) { throw 'candidate source archive failed' }
          Expand-Archive -LiteralPath $candidateArchive -DestinationPath $candidateSource
          Push-Location $candidateSource
          try {
            go mod verify
            if ($LASTEXITCODE -ne 0) { throw 'candidate go mod verify failed' }
            $candidateVersion = "v0.1.0-candidate.$candidateCommit"
            $candidateLdflags = "-X github.com/lifei6671/xtunnel/internal/buildinfo.version=$candidateVersion"
            go build -trimpath -ldflags $candidateLdflags -o $previousAgentPath ./cmd/agent
            if ($LASTEXITCODE -ne 0) { throw 'candidate Windows arm64 Agent build failed' }
          }
          finally {
            Pop-Location
          }

          ./deploy/windows/smoke.ps1 -PreviousAgentPath $previousAgentPath `
            -AgentPath $agentPath -GateHelperPath $gateHelperPath

      - name: Verify working tree remains clean
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          $status = git status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw 'git status failed' }
          if ($status) { throw "working tree is dirty after Windows arm64 verification`n$status" }

  alpha-release-chaos:
    if: github.event_name == 'workflow_dispatch' && inputs.release_gate
    name: Alpha release reconnect and durable chaos
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup latest Go 1.27.x
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false

      - name: Setup Node 24.19.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.19.0'
          check-latest: false
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the embedded web assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm --version)" = '11.17.0'
          npm --prefix web ci
          npm --prefix web run check
          npm --prefix web run build

      - name: Run full reconnect and durable-operation chaos
        shell: bash
        timeout-minutes: 70
        run: |
          set -euo pipefail
          ./tools/check-go-version.sh
          sudo prlimit --pid "$$" --nofile=1048576:1048576
          result_dir="$RUNNER_TEMP/m7-10-release-chaos"
          ./tests/release/run-hardening.sh -s chaos -o "$result_dir"

      - name: Upload verified reconnect and durable chaos candidate evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m7-10-candidate-chaos-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m7-10-release-chaos
          if-no-files-found: error
          retention-days: 14

  alpha-release-analysis:
    if: github.event_name == 'workflow_dispatch' && inputs.release_gate
    name: Alpha release profile fuzz and leak
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup latest Go 1.27.x
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false

      - name: Setup Node 24.19.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.19.0'
          check-latest: false
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install profile tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends strace

      - name: Run full concurrency profile, fuzz, and leak gates
        shell: bash
        timeout-minutes: 145
        run: |
          set -euo pipefail
          ./tools/check-go-version.sh
          result_dir="$RUNNER_TEMP/m7-10-release-analysis"
          ./tests/release/run-hardening.sh -s analysis -o "$result_dir"

      - name: Upload verified profile, fuzz, and leak candidate evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m7-10-candidate-analysis-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m7-10-release-analysis
          if-no-files-found: error
          retention-days: 14

  alpha-release-scale:
    if: github.event_name == 'workflow_dispatch' && inputs.release_gate
    name: Alpha release public scale
    runs-on: ubuntu-24.04
