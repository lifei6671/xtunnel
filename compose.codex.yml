services:
  go-runner:
    image: golang:1.27-bookworm
    working_dir: /workspace
    environment:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    command: ["sleep", "infinity"]
    volumes:
      - .:/workspace
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build

  web-runner:
    image: node:24.19.0-bookworm@sha256:4196d66a565c6f195728d9952f161f4adfe2ad753052a08b7ec7f1c5a6bda42b
    working_dir: /workspace
    command: ["sleep", "infinity"]
    volumes:
      - .:/workspace
      - npm-cache:/root/.npm
      - web-node-modules:/workspace/web/node_modules

volumes:
  go-mod:
  go-build:
  npm-cache:
  web-node-modules:
