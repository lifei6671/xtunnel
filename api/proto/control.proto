syntax = "proto3";

package xtunnel.protocol.v1;

option go_package = "github.com/lifei6671/xtunnel/internal/protocol/gen;protocolv1";

import "common.proto";

// ConnectionToken 是 Tunnel 下所有 Connector 共享的唯一启动输入。文本形式固定为
// "xta_" 加上本消息确定性 Protobuf 字节的无填充 Base64URL 编码。
// 解析器必须拒绝未知字段、非规范 Base64URL、非确定性编码、缺失字段和多余字节；
// integrity_tag 参与完整性验证，不是可选的附加字段。
message ConnectionToken {
  // format_version 是 Token 编码版本。Protocol v1 固定为 1。
  uint32 format_version = 1;

  // endpoint 是 Agent Gateway 的连接终点。
  GatewayEndpoint endpoint = 2;

  // tls_trust 是 Agent 建立 TLS 时唯一允许使用的信任描述。
  TlsTrustDescriptor tls_trust = 3;

  // tunnel_id、token_id（tok_<ULID>）与 token_version 共同标识 Server 侧 Credential。
  // 同一 Tunnel 的多个 Connector 复用这份身份，不为每个运行副本签发独立 Token。
  string tunnel_id = 4;
  string token_id = 5;
  uint64 token_version = 6;

  // authentication_secret 必须恰为 32 字节，由 CSPRNG 生成。
  bytes authentication_secret = 7;

  // integrity_tag 是 HMAC-SHA256(authentication_secret,
  // "xtunnel-connection-token-v1" || deterministic_protobuf(token_without_tag))。
  // 解析器必须先验证本字段，再使用任何连接或身份语义。
  bytes integrity_tag = 8;
}

// GatewayEndpoint 使用分离的主机和端口，避免 IPv6 文本形式产生歧义。
message GatewayEndpoint {
  // host 是 DNS 名称或 IP 地址，禁止携带 scheme、路径或空白。
  string host = 1;

  // port 是 Agent Gateway 的 TCP 端口，取值范围为 1 到 65535。
  uint32 port = 2;
}

// TlsTrustDescriptor 冻结 Token 可携带的两种 TLS 信任模式。
message TlsTrustDescriptor {
  oneof mode {
    // public_ca 表示按系统 Public CA 验证 Server 证书。
    PublicCATrust public_ca = 1;

    // pinned_spki_sha256 表示只接受给定 SHA-256 SPKI 摘要的 Server 证书。
    PinnedSPKITrust pinned_spki_sha256 = 2;
  }
}

// PublicCATrust 是 Public CA 信任模式的显式标记消息。
message PublicCATrust {}

// PinnedSPKITrust 保存 32 字节 SHA-256 SPKI 摘要。
message PinnedSPKITrust {
  bytes spki_sha256 = 1;
}

// ConnectorAuthRequest 是 TLS 建立后、ControlEnvelope 之前唯一允许的 Connector 请求。
message ConnectorAuthRequest {
  string connection_token = 1;
  string connector_id = 2;
  string hostname = 3;
  string version = 4;
  string os = 5;
  string arch = 6;
  uint32 min_protocol = 7;
  uint32 max_protocol = 8;
  repeated string capabilities = 9;
}

// ConnectorAuthResult 是 Server 在 AUTH 阶段唯一允许返回的认证结果。
message ConnectorAuthResult {
  oneof result {
    ConnectorAuthSuccess success = 1;
    ConnectorAuthFailure failure = 2;
  }
}

// ConnectorAuthSuccess 是完整 flush 后双方切换至 ESTABLISHED 的提交载体。
message ConnectorAuthSuccess {
  string tunnel_id = 1;
  string session_id = 2;
  // session_secret 必须恰为 32 字节，仅属于当前 Session。
  bytes session_secret = 3;
  uint32 protocol_version = 4;
  uint64 desired_revision = 5;
  uint32 heartbeat_interval_ms = 6;
}

// ConnectorAuthFailure 在可安全写入时必须完整 flush，随后关闭 TLS 连接。
message ConnectorAuthFailure {
  ErrorCode error_code = 1;
  uint32 retry_after_ms = 2;
}

// ControlEnvelope 仅用于 ESTABLISHED 或 DRAINING 状态。
// Connector 到 Server：heartbeat、config_ack、service_health_batch、drain_request、error。
// Server 到 Connector：config_snapshot、work_demand、drain_ack、error。
message ControlEnvelope {
  uint32 protocol_version = 1;

  oneof payload {
    Heartbeat heartbeat = 10;
    TunnelSnapshot config_snapshot = 11;
    ConfigAck config_ack = 12;
    WorkDemand work_demand = 13;
    ServiceHealthBatch service_health_batch = 14;
    DrainRequest drain_request = 15;
    Error error = 16;
    DrainAck drain_ack = 17;
  }
}

// Heartbeat 只由 Connector 在 ESTABLISHED 或 DRAINING 状态发送。
message Heartbeat {
  uint64 timestamp_ms = 1;
  uint64 observed_revision = 2;
  uint32 tcp_idle = 3;
  uint32 tcp_active = 4;
  uint64 ingress_bytes = 5;
  uint64 egress_bytes = 6;
  uint32 tcp_connecting = 7;
}

// TunnelSnapshot 是 Server 向一个 Connector 下发的 Tunnel 完整远端 Desired State。
// 同一 Tunnel 的所有在线 Connector 接收同一组 Service 配置。
message TunnelSnapshot {
  string tunnel_id = 1;
  uint64 revision = 2;
  repeated ServiceConfig services = 3;
}

// ServiceConfig 是挂载在 Tunnel 上的单个代理服务及其后端连接配置。
message ServiceConfig {
  string service_id = 1;
  string origin_scheme = 2;
  string origin_host = 3;
  uint32 origin_port = 4;
  uint32 connect_timeout_ms = 5;
  bool tls_verify = 6;
  string tls_server_name = 7;
  string origin_http_host = 8;
  HealthCheckConfig health = 9;
  bool enabled = 10;
  uint64 required_revision = 11;

  // origin_connection_options 对所有 Service 必填。connect_timeout_ms 仍是
  // DNS、TCP 与可选 TLS 握手共享的总预算；本消息只控制 TCP 建连行为。
  OriginConnectionOptions origin_connection_options = 12;

  // http_proxy_options 对 HTTP/HTTPS Service 必填，对 TCP Service 必须缺失。
  // Agent v0.1 只编译并保存本消息，后续 HTTP 数据面才会创建 HTTP Transport。
  HTTPProxyOptions http_proxy_options = 13;
}

// OriginConnectionOptions 描述 Agent 每次连接 Origin 时采用的 TCP 建连参数。
message OriginConnectionOptions {
  // disable_happy_eyeballs 为 true 时禁用标准库 Fast Fallback。
  bool disable_happy_eyeballs = 1;

  // tcp_keepalive_interval_ms 为 0 时明确禁用 TCP keepalive；否则是探测间隔。
  uint32 tcp_keepalive_interval_ms = 2;
}

// HTTPProxyOptions 描述后续 HTTP/HTTPS 数据面使用的不可变代理参数。
message HTTPProxyOptions {
  bool disable_chunked_encoding = 1;

  // idle_connection_timeout_ms 必须大于 0。
  uint32 idle_connection_timeout_ms = 2;

  // max_idle_connections 必须大于 0。
  uint32 max_idle_connections = 3;
}

// HealthCheckConfig 描述单个 Service 的 Origin 健康检查策略。
message HealthCheckConfig {
  HealthType type = 1;
  string path = 2;
  uint32 interval_ms = 3;
  uint32 timeout_ms = 4;
  uint32 expected_status_min = 5;
  uint32 expected_status_max = 6;
  uint32 failure_threshold = 7;
  uint32 success_threshold = 8;
}

// ConfigAck 只在完整 Snapshot 原子应用成功或拒绝后由 Connector 发送。
message ConfigAck {
  uint64 observed_revision = 1;
  ConfigApplyStatus apply_status = 2;
  ErrorCode error_code = 3;
}

// WorkDemand 是 Server 为当前 Session 发放的 WorkConn 补池预算 Lease。
message WorkDemand {
  string budget_lease_id = 1;
  uint32 desired_non_active = 2;
  uint32 max_new_connections = 3;
  uint32 lease_ttl_ms = 4;
  uint64 demand_generation = 5;
}

// ServiceHealth 是 Connector 对单个 Service 后端的当前健康观测。
message ServiceHealth {
  string service_id = 1;
  HealthStatus status = 2;
  uint32 latency_ms = 3;
  string error_code = 4;
  uint64 checked_at_ms = 5;
  uint64 service_revision = 6;
}

// ServiceHealthBatch 在一个 Control Session 内按 generation 严格递增。
message ServiceHealthBatch {
  uint64 generation = 1;
  repeated ServiceHealth items = 2;
}

// DrainRequest 由 Connector 发起；重复相同 drain_id 与内容必须幂等。
message DrainRequest {
  string drain_id = 1;
  uint32 drain_timeout_ms = 2;
}

// DrainAck 由 Server 返回；重复相同 drain_id 与内容必须幂等。
message DrainAck {
  string drain_id = 1;
  uint32 remaining_active = 2;
}

// Error 只用于已建立的 ControlEnvelope，禁止用于 AUTH 阶段。
message Error {
  ErrorCode error_code = 1;
  uint32 retry_after_ms = 2;
}
