openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: XTunnel Management API
  version: 0.1.0
  description: |
    XTunnel Standalone V0.1 同源管理面契约。除登录外都要求管理 Session；所有状态变更
    同时要求 Origin 和 X-XTunnel-CSRF。分页 Token 与 Service ETag 对客户端完全不透明。
servers:
  - url: /api/v1
    description: Same-origin XTunnel Server.
security:
  - cookieAuth: []
tags:
  - { name: Authentication }
  - { name: Tunnels }
  - { name: Services }
  - { name: Dashboard }
  - { name: System }
  - { name: Security Audit }

paths:
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: 创建管理员 Session
      security: []
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功。
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Pragma: { $ref: '#/components/headers/NoCache' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/SetupRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: 销毁当前管理员 Session
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      responses:
        '204':
          description: Session 已销毁；响应不包含 Body。
          headers:
            Set-Cookie: { description: 清除 Session Cookie。, schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentAdmin
      summary: 读取当前管理员和 CSRF Token
      responses:
        '200':
          description: 当前 Session。
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Pragma: { $ref: '#/components/headers/NoCache' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /tunnels:
    post:
      tags: [Tunnels]
      operationId: createTunnel
      summary: 创建 Tunnel 并签发第一代 Connection Token
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTunnelRequest' }
      responses:
        '201':
          description: Tunnel 与第一代 Token 已创建。
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/TunnelETag' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Pragma: { $ref: '#/components/headers/NoCache' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TunnelCredentialResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Tunnels]
      operationId: listTunnels
      summary: 分页读取 Tunnel
      parameters:
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TunnelStatus' } }
      responses:
        '200':
          description: 按 id 升序；无后续页时省略 next_page_token。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TunnelList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /tunnels/{tunnel_id}:
    parameters: [{ $ref: '#/components/parameters/TunnelID' }]
    get:
      tags: [Tunnels]
      operationId: getTunnel
      summary: 读取单个 Tunnel
      responses:
        '200':
          description: Tunnel 当前表示。
          headers:
            ETag: { $ref: '#/components/headers/TunnelETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tunnel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Tunnels]
      operationId: updateTunnel
      summary: 以 JSON Merge Patch 修改 Tunnel 名称
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/UpdateTunnelRequest' }
      responses:
        '200': { $ref: '#/components/responses/TunnelOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Tunnels]
      operationId: deleteTunnel
      summary: 删除没有 Service 引用的 Tunnel
      description: 不级联 Service 或 Route；存在引用时返回 TUNNEL_IN_USE。
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '204': { description: Tunnel 已删除；响应不包含 Body。 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
  /tunnels/{tunnel_id}/connectors:
    parameters: [{ $ref: '#/components/parameters/TunnelID' }]
    get:
      tags: [Tunnels]
      operationId: listTunnelConnectors
      summary: 分页读取仍有 Current Control Session 的 Connector
      description: 断连或心跳过期后不返回，也不伪造 OFFLINE 状态。
      parameters:
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ConnectorStatus' } }
      responses:
        '200':
          description: 按 connector_id 升序。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /tunnels/{tunnel_id}/token:
    parameters: [{ $ref: '#/components/parameters/TunnelID' }]
    get:
      tags: [Tunnels]
      operationId: revealTunnelToken
      summary: 审计后返回当前 ACTIVE Connection Token
      responses:
        '200': { $ref: '#/components/responses/SecretCredentialOK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /tunnels/{tunnel_id}/token/rotate:
    parameters: [{ $ref: '#/components/parameters/TunnelID' }]
    post:
      tags: [Tunnels]
      operationId: rotateTunnelToken
      summary: 签发下一代 Token；既有 Session 保持在线
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: 新 Token。
          headers:
            ETag: { $ref: '#/components/headers/TunnelETag' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Pragma: { $ref: '#/components/headers/NoCache' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionCredential' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
  /tunnels/{tunnel_id}/token/revoke:
    parameters: [{ $ref: '#/components/parameters/TunnelID' }]
    post:
      tags: [Tunnels]
      operationId: revokeTunnelToken
      summary: 撤销当前 Token 的新认证但不撤销 Tunnel
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: 已撤销的 Token 元数据；永不返回 Token 文本。
          headers:
            ETag: { $ref: '#/components/headers/TunnelETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionCredentialMetadata' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
  /tunnels/{tunnel_id}/revoke:
    parameters: [{ $ref: '#/components/parameters/TunnelID' }]
    post:
      tags: [Tunnels]
      operationId: revokeTunnel
      summary: 撤销 Tunnel、全部 Token 与运行时访问
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200': { $ref: '#/components/responses/TunnelOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /services:
    post:
      tags: [Services]
      operationId: createService
      summary: 在指定 Tunnel 下创建 Service
      description: If-Match 必须是父 Tunnel 的当前强 ETag。
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServiceRequest' }
      responses:
        '201':
          description: Service 已创建；ETag 绑定 Service 与 Tunnel 版本。
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ServiceETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Services]
      operationId: listServices
      summary: 分页读取一个 Tunnel 下的 Service
      parameters:
        - { name: tunnel_id, in: query, required: true, schema: { $ref: '#/components/schemas/TunnelID' } }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ServiceStatus' } }
        - { name: enabled, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: 按 id 升序。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /services/{service_id}:
    parameters: [{ $ref: '#/components/parameters/ServiceID' }]
    get:
      tags: [Services]
      operationId: getService
      summary: 读取单个 Service
      responses:
        '200': { $ref: '#/components/responses/ServiceOK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Services]
      operationId: updateService
      summary: 以 JSON Merge Patch 修改 Service
      description: |
        If-Match 是绑定 Service Version 与 Tunnel Version 的强不透明 ETag。omitted 表示
        不修改；health/exposure 的 null 表示禁用或移除；其他 null 返回 VALIDATION_FAILED。
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/UpdateServiceRequest' }
      responses:
        '200': { $ref: '#/components/responses/ServiceOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Services]
      operationId: deleteService
      summary: 删除 Service 及其唯一 Public Exposure
      description: Service 与 Exposure 在同一事务内删除，不留下 Route 引用。
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '204': { description: Service 已删除；响应不包含 Body。 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
  /services/{service_id}/enable:
    parameters: [{ $ref: '#/components/parameters/ServiceID' }]
    post:
      tags: [Services]
      operationId: enableService
      summary: 启用 Service
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200': { $ref: '#/components/responses/ServiceOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
  /services/{service_id}/disable:
    parameters: [{ $ref: '#/components/parameters/ServiceID' }]
    post:
      tags: [Services]
      operationId: disableService
      summary: 禁用 Service
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200': { $ref: '#/components/responses/ServiceOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: 读取 Server 权威状态汇总
      responses:
        '200':
          description: Dashboard 快照；客户端不得重算状态。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /system/info:
    get:
      tags: [System]
      operationId: getSystemInfo
      summary: 读取 Server 构建与运行信息
      responses:
        '200':
          description: Server 信息。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /system/health:
    get:
      tags: [System]
      operationId: getSystemHealth
      summary: 读取已认证的管理面健康状态
      responses:
        '200':
          description: 管理面健康状态。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /system/config:
    get:
      tags: [System]
      operationId: getSystemConfig
      summary: 读取安全的 Server 有效配置投影
      description: 不返回路径、Private Key、Token、Secret 或完整内部 Config。
      responses:
        '200':
          description: 只读安全配置投影。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /security-audit-events:
    get:
      tags: [Security Audit]
      operationId: listSecurityAuditEvents
      summary: 只读查询持久化 Security Audit Event
      description: |
        按 (occurred_at,event_id) 倒序；游标绑定全部筛选条件；Digest 是 32-byte 值的
        小写十六进制文本。本资源没有任何 Mutation endpoint。
      parameters:
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
        - { name: action, in: query, schema: { $ref: '#/components/schemas/SecurityAuditAction' } }
        - { name: result, in: query, schema: { $ref: '#/components/schemas/SecurityAuditResult' } }
        - { name: resource_type, in: query, schema: { $ref: '#/components/schemas/SecurityAuditResourceType' } }
        - { name: resource_id, in: query, schema: { type: string, minLength: 1, maxLength: 256 } }
        - { name: occurred_from, in: query, description: 包含此 UTC 时刻。, schema: { $ref: '#/components/schemas/DateTime' } }
        - { name: occurred_to, in: query, description: 不包含此 UTC 时刻。, schema: { $ref: '#/components/schemas/DateTime' } }
      responses:
        '200':
          description: Security Audit Event 列表。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityAuditEventList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /security-audit-events/export:
    get:
      tags: [Security Audit]
      operationId: exportSecurityAuditEvents
      summary: 流式导出持久化 Security Audit Event
      description: |
        复用列表筛选语义。Server 在响应开始前固定 (occurred_at,event_id) 上界，
        随后按倒序 keyset 有界分页并逐行输出完整 SecurityAuditEvent JSON；并发追加
        不进入本次导出。连接取消或写失败会立即终止，客户端不得把中断响应视为完整导出。
      parameters:
        - { name: action, in: query, schema: { $ref: '#/components/schemas/SecurityAuditAction' } }
        - { name: result, in: query, schema: { $ref: '#/components/schemas/SecurityAuditResult' } }
        - { name: resource_type, in: query, schema: { $ref: '#/components/schemas/SecurityAuditResourceType' } }
        - { name: resource_id, in: query, schema: { type: string, minLength: 1, maxLength: 256 } }
        - { name: occurred_from, in: query, description: 包含此 UTC 时刻。, schema: { $ref: '#/components/schemas/DateTime' } }
        - { name: occurred_to, in: query, description: 不包含此 UTC 时刻。, schema: { $ref: '#/components/schemas/DateTime' } }
      responses:
        '200':
          description: NDJSON 流；每行是一个 SecurityAuditEvent，空结果返回空 Body。
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Content-Disposition:
              required: true
              schema: { type: string, const: 'attachment; filename="xtunnel-security-audit.ndjson"' }
          content:
            application/x-ndjson:
              schema:
                type: string
                format: binary
                description: 逐行编码的 SecurityAuditEvent JSON。
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: xtunnel_admin_session
      description: 256-bit Token；HTTPS 模式使用 Secure，本机 HTTP 模式不设置 Secure；HttpOnly、SameSite=Lax、Host-only、Path=/api/v1。
    csrfToken:
      type: apiKey
      in: header
      name: X-XTunnel-CSRF
      description: 与 Session 绑定的 32-byte base64url Token。
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      description: 必须与规范化 Management Host 同源。
      schema: { type: string, format: uri }
    TunnelID:
      name: tunnel_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/TunnelID' }
    ServiceID:
      name: service_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ServiceID' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 单个精确强 ETag；不接受 *、弱 ETag 或多值。
      schema: { type: string, pattern: '^"[^"\r\n]+"$' }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    PageToken:
      name: page_token
      in: query
      description: 绑定资源、排序边界和 Filter Hash 的 Server 不透明 Token。
      schema: { type: string, minLength: 1, maxLength: 4096 }
  headers:
    TunnelETag:
      description: Tunnel Version 强 ETag，例如 `"7"`。
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    ServiceETag:
      description: 绑定 Service Version 与 Tunnel Version 的强不透明 ETag。
      schema: { type: string, pattern: '^"[^"\r\n]+"$' }
    NoStore: { description: Secret 响应禁止存储。, schema: { type: string, const: no-store } }
    NoCache: { description: 兼容缓存禁止指令。, schema: { type: string, const: no-cache } }
    SessionCookie:
      description: xtunnel_admin_session；HTTPS 模式使用 Secure，本机 HTTP 模式不设置 Secure；HttpOnly、SameSite=Lax、Host-only、Path=/api/v1。
      schema: { type: string }
    RetryAfter: { description: 建议等待秒数。, schema: { type: integer, minimum: 1 } }
    Location: { description: 新资源的同源 `/api/v1` 路径。, schema: { type: string, pattern: '^/api/v1/' } }
  responses:
    TunnelOK:
      description: Tunnel 当前表示。
      headers:
        ETag: { $ref: '#/components/headers/TunnelETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Tunnel' }
    ServiceOK:
      description: Service 当前表示。
      headers:
        ETag: { $ref: '#/components/headers/ServiceETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Service' }
    SecretCredentialOK:
      description: 当前 Token 与部署指引；同一 Token Version 内逐字节稳定。
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Pragma: { $ref: '#/components/headers/NoCache' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ConnectionCredential' }
    BadRequest: { description: 请求格式错误。, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: 未认证、凭据错误或 Session 失效。, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Origin、CSRF 或权限校验失败。, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: 资源不存在。, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: 领域不变量冲突。, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    SetupRequired:
      description: 尚无管理员，必须先通过受支持的本机 Bootstrap 路径创建首个 Admin；错误码固定为 SETUP_REQUIRED。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SetupRequiredErrorResponse' }
    PreconditionFailed: { description: ETag 与当前版本冲突。, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    ValidationFailed: { description: 字段或容量校验失败。, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    PreconditionRequired: { description: 缺少 If-Match。, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    RateLimited:
      description: 请求被限流。
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError: { description: 内部错误且不泄露实现细节。, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  schemas:
    DateTime: { type: string, format: date-time, pattern: 'Z$', description: RFC 3339 UTC `Z` 时间戳。 }
    TunnelID: { type: string, pattern: '^tun_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
    ServiceID: { type: string, pattern: '^svc_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
    ConnectorID: { type: string, pattern: '^con_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
    TokenID: { type: string, pattern: '^tok_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
    AdminID: { type: string, pattern: '^adm_[0-7][0-9A-HJKMNP-TV-Z]{25}$', description: 与 Audit ADMIN actor_id 相同。 }
    EventID: { type: string, pattern: '^evt_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
    OperationID: { type: string, pattern: '^op_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
    RequestID: { type: string, minLength: 1, maxLength: 128 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, writeOnly: true }
    Admin:
      type: object
      additionalProperties: false
      required: [id, username]
      properties:
        id: { $ref: '#/components/schemas/AdminID' }
        username: { type: string, minLength: 1 }
    AuthSession:
      type: object
      additionalProperties: false
      required: [admin, csrf_token, expires_at]
      properties:
        admin: { $ref: '#/components/schemas/Admin' }
        csrf_token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: 32-byte 无 padding base64url Token。 }
        expires_at: { $ref: '#/components/schemas/DateTime' }

    TunnelStatus: { type: string, enum: [PENDING, ONLINE, DEGRADED, OFFLINE, REVOKED] }
    Tunnel:
      type: object
      additionalProperties: false
      required: [id, name, version, desired_revision, status, connectors_online, services_count, active_connections, last_seen_at, first_authenticated_at, revoked_at, created_at, updated_at]
      allOf:
        - if:
            properties: { status: { const: REVOKED } }
            required: [status]
          then:
            properties: { revoked_at: { $ref: '#/components/schemas/DateTime' } }
          else:
            properties: { revoked_at: { type: 'null' } }
        - if:
            properties: { status: { enum: [ONLINE, DEGRADED, OFFLINE] } }
            required: [status]
          then:
            properties: { first_authenticated_at: { $ref: '#/components/schemas/DateTime' } }
        - if:
            properties: { status: { const: PENDING } }
            required: [status]
          then:
            properties: { first_authenticated_at: { type: 'null' } }
      properties:
        id: { $ref: '#/components/schemas/TunnelID' }
        name: { type: string, minLength: 1 }
        version: { type: integer, format: int64, minimum: 1 }
        desired_revision: { type: integer, format: int64, minimum: 0 }
        status: { $ref: '#/components/schemas/TunnelStatus' }
        connectors_online: { type: integer, minimum: 0 }
        services_count: { type: integer, minimum: 0 }
        active_connections: { type: integer, minimum: 0 }
        last_seen_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        first_authenticated_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        revoked_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
    CreateTunnelRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties: { name: { type: string, minLength: 1 } }
    UpdateTunnelRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties: { name: { type: string, minLength: 1 } }
    TunnelList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Tunnel' } }
        next_page_token: { type: string, minLength: 1, maxLength: 4096 }

    ConnectorStatus: { type: string, enum: [ONLINE, DEGRADED, DRAINING] }
    Connector:
      type: object
      additionalProperties: false
      required: [id, tunnel_id, hostname, os, arch, version, status, idle_work_connections, active_connections, connected_at, last_heartbeat_at, config_ready, observed_revision]
      properties:
        id: { $ref: '#/components/schemas/ConnectorID' }
        tunnel_id: { $ref: '#/components/schemas/TunnelID' }
        hostname: { type: string, minLength: 1 }
        os: { type: string, minLength: 1 }
        arch: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
        status: { $ref: '#/components/schemas/ConnectorStatus' }
        idle_work_connections: { type: integer, minimum: 0 }
        active_connections: { type: integer, minimum: 0 }
        connected_at: { $ref: '#/components/schemas/DateTime' }
        last_heartbeat_at: { $ref: '#/components/schemas/DateTime' }
        config_ready: { type: boolean }
        observed_revision: { type: integer, format: int64, minimum: 0 }
    ConnectorList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Connector' } }
        next_page_token: { type: string, minLength: 1, maxLength: 4096 }

    ConnectionCredentialMetadata:
      type: object
      additionalProperties: false
      required: [tunnel_id, token_id, token_version, status]
      properties:
        tunnel_id: { $ref: '#/components/schemas/TunnelID' }
        token_id: { $ref: '#/components/schemas/TokenID' }
        token_version: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [ACTIVE, REVOKED_FOR_NEW_SESSION, REVOKED] }
    DeploymentCommand:
      type: object
      additionalProperties: false
      required: [environment, command]
      properties:
        environment: { type: string, enum: [FOREGROUND, CONTAINER, LINUX_SYSTEMD, WINDOWS_SCM] }
        command: { type: string, minLength: 1, description: 一次性展示，可能包含完整 Token。 }
    ConnectionCredential:
      type: object
      additionalProperties: false
      required: [tunnel_id, token_id, token_version, status, connection_token, deployment_commands]
      properties:
        tunnel_id: { $ref: '#/components/schemas/TunnelID' }
        token_id: { $ref: '#/components/schemas/TokenID' }
        token_version: { type: integer, format: int64, minimum: 1 }
        status: { type: string, const: ACTIVE }
        connection_token: { type: string, pattern: '^xta_[A-Za-z0-9_-]+$', minLength: 5, maxLength: 8192 }
        deployment_commands: { type: array, minItems: 4, maxItems: 4, items: { $ref: '#/components/schemas/DeploymentCommand' } }
    TunnelCredentialResponse:
      type: object
      additionalProperties: false
      required: [tunnel, credential]
      properties:
        tunnel: { $ref: '#/components/schemas/Tunnel' }
        credential: { $ref: '#/components/schemas/ConnectionCredential' }

    Origin:
      oneOf:
        - { $ref: '#/components/schemas/HTTPOrigin' }
        - { $ref: '#/components/schemas/HTTPSOrigin' }
        - { $ref: '#/components/schemas/TCPOrigin' }
      discriminator:
        propertyName: scheme
        mapping:
          http: '#/components/schemas/HTTPOrigin'
          https: '#/components/schemas/HTTPSOrigin'
          tcp: '#/components/schemas/TCPOrigin'
    HTTPOrigin:
      type: object
      additionalProperties: false
      required: [scheme, host, port, connect_timeout_ms]
      properties:
        scheme: { type: string, const: http }
        host: { type: string, minLength: 1 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        connect_timeout_ms: { type: integer, minimum: 1, maximum: 4294967295, default: 5000 }
        http_host_header: { type: string, minLength: 1 }
    HTTPSOrigin:
      type: object
      additionalProperties: false
      required: [scheme, host, port, connect_timeout_ms, tls_verify]
      properties:
        scheme: { type: string, const: https }
        host: { type: string, minLength: 1 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        connect_timeout_ms: { type: integer, minimum: 1, maximum: 4294967295, default: 5000 }
        tls_verify: { type: boolean, default: true }
        tls_server_name: { type: string, minLength: 1 }
        http_host_header: { type: string, minLength: 1 }
    TCPOrigin:
      type: object
      additionalProperties: false
      required: [scheme, host, port, connect_timeout_ms]
      properties:
        scheme: { type: string, const: tcp }
        host: { type: string, minLength: 1 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        connect_timeout_ms: { type: integer, minimum: 1, maximum: 4294967295, default: 5000 }
    OriginInput:
      oneOf:
        - { $ref: '#/components/schemas/HTTPOriginInput' }
        - { $ref: '#/components/schemas/HTTPSOriginInput' }
        - { $ref: '#/components/schemas/TCPOriginInput' }
      discriminator:
        propertyName: scheme
        mapping:
          http: '#/components/schemas/HTTPOriginInput'
          https: '#/components/schemas/HTTPSOriginInput'
          tcp: '#/components/schemas/TCPOriginInput'
    HTTPOriginInput:
      type: object
      additionalProperties: false
      required: [scheme, host, port]
      properties:
        scheme: { type: string, const: http }
        host: { type: string, minLength: 1 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        connect_timeout_ms: { type: integer, minimum: 1, maximum: 4294967295, default: 5000 }
        http_host_header: { type: string, minLength: 1 }
    HTTPSOriginInput:
      type: object
      additionalProperties: false
      required: [scheme, host, port]
      properties:
        scheme: { type: string, const: https }
        host: { type: string, minLength: 1 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        connect_timeout_ms: { type: integer, minimum: 1, maximum: 4294967295, default: 5000 }
        tls_verify: { type: boolean, default: true }
        tls_server_name: { type: string, minLength: 1 }
        http_host_header: { type: string, minLength: 1 }
    TCPOriginInput:
      type: object
      additionalProperties: false
      required: [scheme, host, port]
      properties:
        scheme: { type: string, const: tcp }
        host: { type: string, minLength: 1 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        connect_timeout_ms: { type: integer, minimum: 1, maximum: 4294967295, default: 5000 }
    OriginPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 字段与有效 scheme 的适用性按 Origin 联合类型校验。
      properties:
        scheme: { type: string, enum: [http, https, tcp] }
        host: { type: string, minLength: 1 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        connect_timeout_ms: { type: integer, minimum: 1, maximum: 4294967295 }
        tls_verify: { type: boolean }
        tls_server_name: { type: string, minLength: 1 }
        http_host_header: { type: string, minLength: 1 }

    ProxyOptions:
      oneOf:
        - { $ref: '#/components/schemas/HTTPProxyOptions' }
        - { $ref: '#/components/schemas/TCPProxyOptions' }
    HTTPProxyOptions:
      type: object
      additionalProperties: false
      required: [disable_chunked_encoding, disable_happy_eyeballs, http_idle_connection_timeout_ms, http_max_idle_connections, tcp_keepalive_interval_ms]
      properties:
        disable_chunked_encoding: { type: boolean, default: false }
        disable_happy_eyeballs: { type: boolean, default: false }
        http_idle_connection_timeout_ms: { type: integer, minimum: 1, maximum: 4294967295, default: 90000 }
        http_max_idle_connections: { type: integer, minimum: 1, maximum: 4294967295, default: 100 }
        tcp_keepalive_interval_ms: { type: integer, minimum: 0, maximum: 4294967295, default: 30000 }
    TCPProxyOptions:
      type: object
      additionalProperties: false
      required: [disable_happy_eyeballs, tcp_keepalive_interval_ms]
      properties:
        disable_happy_eyeballs: { type: boolean, default: false }
        tcp_keepalive_interval_ms: { type: integer, minimum: 0, maximum: 4294967295, default: 30000 }
    ProxyOptionsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        disable_chunked_encoding: { type: boolean }
        disable_happy_eyeballs: { type: boolean }
        http_idle_connection_timeout_ms: { type: integer, minimum: 1, maximum: 4294967295 }
        http_max_idle_connections: { type: integer, minimum: 1, maximum: 4294967295 }
        tcp_keepalive_interval_ms: { type: integer, minimum: 0, maximum: 4294967295 }
    ProxyOptionsInput:
      type: object
      additionalProperties: false
      description: 省略字段使用机器契约中的 V0.1 默认值；HTTP 专属字段用于 TCP 时拒绝。
      properties:
        disable_chunked_encoding: { type: boolean, default: false }
        disable_happy_eyeballs: { type: boolean, default: false }
        http_idle_connection_timeout_ms: { type: integer, minimum: 1, maximum: 4294967295, default: 90000 }
        http_max_idle_connections: { type: integer, minimum: 1, maximum: 4294967295, default: 100 }
        tcp_keepalive_interval_ms: { type: integer, minimum: 0, maximum: 4294967295, default: 30000 }

    HealthCheck:
      oneOf:
        - { $ref: '#/components/schemas/TCPHealthCheck' }
        - { $ref: '#/components/schemas/HTTPHealthCheck' }
      discriminator:
        propertyName: type
        mapping:
          TCP: '#/components/schemas/TCPHealthCheck'
          HTTP: '#/components/schemas/HTTPHealthCheck'
    TCPHealthCheck:
      type: object
      additionalProperties: false
      required: [type, interval_ms, timeout_ms, failure_threshold, success_threshold]
      properties:
        type: { type: string, const: TCP }
        interval_ms: { type: integer, minimum: 1000, maximum: 3600000, default: 10000 }
        timeout_ms: { type: integer, minimum: 100, default: 2000, description: 必须小于 interval_ms。 }
        failure_threshold: { type: integer, minimum: 1, maximum: 20, default: 3 }
        success_threshold: { type: integer, minimum: 1, maximum: 20, default: 2 }
    HTTPHealthCheck:
      type: object
      additionalProperties: false
      required: [type, path, interval_ms, timeout_ms, expected_status_min, expected_status_max, failure_threshold, success_threshold]
      properties:
        type: { type: string, const: HTTP }
        path: { type: string, pattern: '^/', default: /health }
        interval_ms: { type: integer, minimum: 1000, maximum: 3600000, default: 10000 }
        timeout_ms: { type: integer, minimum: 100, default: 2000, description: 必须小于 interval_ms。 }
        expected_status_min: { type: integer, minimum: 100, maximum: 599, default: 200 }
        expected_status_max: { type: integer, minimum: 100, maximum: 599, default: 399 }
        failure_threshold: { type: integer, minimum: 1, maximum: 20, default: 3 }
        success_threshold: { type: integer, minimum: 1, maximum: 20, default: 2 }
    HealthCheckPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        type: { type: string, enum: [TCP, HTTP] }
        path: { type: string, pattern: '^/' }
        interval_ms: { type: integer, minimum: 1000, maximum: 3600000 }
        timeout_ms: { type: integer, minimum: 100 }
        expected_status_min: { type: integer, minimum: 100, maximum: 599 }
        expected_status_max: { type: integer, minimum: 100, maximum: 599 }
        failure_threshold: { type: integer, minimum: 1, maximum: 20 }
        success_threshold: { type: integer, minimum: 1, maximum: 20 }
    HealthCheckInput:
      oneOf:
        - { $ref: '#/components/schemas/TCPHealthCheckInput' }
        - { $ref: '#/components/schemas/HTTPHealthCheckInput' }
      discriminator:
        propertyName: type
        mapping:
          TCP: '#/components/schemas/TCPHealthCheckInput'
          HTTP: '#/components/schemas/HTTPHealthCheckInput'
    TCPHealthCheckInput:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, const: TCP }
        interval_ms: { type: integer, minimum: 1000, maximum: 3600000, default: 10000 }
        timeout_ms: { type: integer, minimum: 100, default: 2000 }
        failure_threshold: { type: integer, minimum: 1, maximum: 20, default: 3 }
        success_threshold: { type: integer, minimum: 1, maximum: 20, default: 2 }
    HTTPHealthCheckInput:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, const: HTTP }
        path: { type: string, pattern: '^/', default: /health }
        interval_ms: { type: integer, minimum: 1000, maximum: 3600000, default: 10000 }
        timeout_ms: { type: integer, minimum: 100, default: 2000 }
        expected_status_min: { type: integer, minimum: 100, maximum: 599, default: 200 }
        expected_status_max: { type: integer, minimum: 100, maximum: 599, default: 399 }
        failure_threshold: { type: integer, minimum: 1, maximum: 20, default: 3 }
        success_threshold: { type: integer, minimum: 1, maximum: 20, default: 2 }

    Exposure:
      oneOf:
        - { $ref: '#/components/schemas/HTTPExposure' }
        - { $ref: '#/components/schemas/TCPExposure' }
      discriminator:
        propertyName: type
        mapping:
          http: '#/components/schemas/HTTPExposure'
          tcp: '#/components/schemas/TCPExposure'
    HTTPExposure:
      type: object
      additionalProperties: false
      required: [type, hostname, path_prefix, preserve_host]
      properties:
        type: { type: string, const: http }
        hostname: { type: string, minLength: 1 }
        path_prefix: { type: string, pattern: '^/', default: / }
        preserve_host: { type: boolean, default: true }
    TCPExposure:
      type: object
      additionalProperties: false
      required: [type, public_port]
      properties:
        type: { type: string, const: tcp }
        public_port: { type: integer, minimum: 1, maximum: 65535 }
    ExposurePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 字段与有效 type 的适用性按 Exposure 联合类型校验。
      properties:
        type: { type: string, enum: [http, tcp] }
        hostname: { type: string, minLength: 1 }
        path_prefix: { type: string, pattern: '^/' }
        preserve_host: { type: boolean }
        public_port: { type: integer, minimum: 1, maximum: 65535 }
    ExposureInput:
      oneOf:
        - { $ref: '#/components/schemas/HTTPExposureInput' }
        - { $ref: '#/components/schemas/TCPExposureInput' }
      discriminator:
        propertyName: type
        mapping:
          http: '#/components/schemas/HTTPExposureInput'
          tcp: '#/components/schemas/TCPExposureInput'
    HTTPExposureInput:
      type: object
      additionalProperties: false
      required: [type, hostname]
      properties:
        type: { type: string, const: http }
        hostname: { type: string, minLength: 1 }
        path_prefix: { type: string, pattern: '^/', default: / }
        preserve_host: { type: boolean, default: true }
    TCPExposureInput:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, const: tcp }
        public_port: { type: integer, minimum: 1, maximum: 65535, description: 省略时由 Server 从配置端口池原子分配。 }

    ServiceStatus: { type: string, enum: [DISABLED, APPLY_FAILED, TUNNEL_OFFLINE, CONFIG_SYNCING, ORIGIN_UNHEALTHY, NO_CAPACITY, READY] }
    ApplyFailure:
      type: object
      additionalProperties: false
      required: [error_code, failed_at]
      properties:
        error_code: { type: string, minLength: 1, maxLength: 64 }
        failed_at: { $ref: '#/components/schemas/DateTime' }
    UsageSummary:
      type: object
      additionalProperties: false
      required: [availability, connections_today, ingress_bytes_today, egress_bytes_today]
      description: M6 未就绪时返回 UNAVAILABLE，三个计数器都返回 null，不能伪造为 0。
      if:
        properties: { availability: { const: UNAVAILABLE } }
        required: [availability]
      then:
        properties:
          connections_today: { type: 'null' }
          ingress_bytes_today: { type: 'null' }
          egress_bytes_today: { type: 'null' }
      else:
        properties:
          connections_today: { type: integer, format: int64, minimum: 0 }
          ingress_bytes_today: { type: integer, format: int64, minimum: 0 }
          egress_bytes_today: { type: integer, format: int64, minimum: 0 }
      properties:
        availability: { type: string, enum: [AVAILABLE, UNAVAILABLE] }
        connections_today: { type: [integer, 'null'], format: int64, minimum: 0 }
        ingress_bytes_today: { type: [integer, 'null'], format: int64, minimum: 0 }
        egress_bytes_today: { type: [integer, 'null'], format: int64, minimum: 0 }
    Service:
      type: object
      additionalProperties: false
      required: [id, tunnel_id, name, required_revision, origin, proxy_options, health, exposure, enabled, version, status, apply_failure, healthy_connectors, active_connections, usage, created_at, updated_at]
      allOf:
        - if:
            properties: { status: { const: APPLY_FAILED } }
            required: [status]
          then:
            properties: { apply_failure: { $ref: '#/components/schemas/ApplyFailure' } }
          else:
            properties: { apply_failure: { type: 'null' } }
        - if:
            properties: { enabled: { const: false } }
            required: [enabled]
          then:
            properties: { status: { const: DISABLED } }
          else:
            properties:
              status: { enum: [APPLY_FAILED, TUNNEL_OFFLINE, CONFIG_SYNCING, ORIGIN_UNHEALTHY, NO_CAPACITY, READY] }
      properties:
        id: { $ref: '#/components/schemas/ServiceID' }
        tunnel_id: { $ref: '#/components/schemas/TunnelID' }
        name: { type: string, minLength: 1 }
        required_revision: { type: integer, format: int64, minimum: 0 }
        origin: { $ref: '#/components/schemas/Origin' }
        proxy_options: { $ref: '#/components/schemas/ProxyOptions' }
        health: { oneOf: [{ $ref: '#/components/schemas/HealthCheck' }, { type: 'null' }] }
        exposure: { oneOf: [{ $ref: '#/components/schemas/Exposure' }, { type: 'null' }] }
        enabled: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
        status: { $ref: '#/components/schemas/ServiceStatus' }
        apply_failure: { oneOf: [{ $ref: '#/components/schemas/ApplyFailure' }, { type: 'null' }] }
        healthy_connectors: { type: integer, minimum: 0 }
        active_connections: { type: integer, minimum: 0 }
        usage: { $ref: '#/components/schemas/UsageSummary' }
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
    CreateServiceRequest:
      type: object
      additionalProperties: false
      required: [tunnel_id, name, origin, exposure]
      properties:
        tunnel_id: { $ref: '#/components/schemas/TunnelID' }
        name: { type: string, minLength: 1 }
        origin: { $ref: '#/components/schemas/OriginInput' }
        proxy_options: { $ref: '#/components/schemas/ProxyOptionsInput' }
        health: { oneOf: [{ $ref: '#/components/schemas/HealthCheckInput' }, { type: 'null' }], default: null }
        exposure: { $ref: '#/components/schemas/ExposureInput' }
        enabled: { type: boolean, default: true }
    UpdateServiceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        origin: { $ref: '#/components/schemas/OriginPatch' }
        proxy_options: { $ref: '#/components/schemas/ProxyOptionsPatch' }
        health: { oneOf: [{ $ref: '#/components/schemas/HealthCheckPatch' }, { type: 'null' }] }
        exposure: { oneOf: [{ $ref: '#/components/schemas/ExposurePatch' }, { type: 'null' }] }
    ServiceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Service' } }
        next_page_token: { type: string, minLength: 1, maxLength: 4096 }

    DashboardCounts:
      type: object
      additionalProperties: false
      required: [tunnels_total, tunnels_online, tunnels_offline, connectors_online, services_total, services_ready, services_error, active_connections]
      properties:
        tunnels_total: { type: integer, minimum: 0 }
        tunnels_online: { type: integer, minimum: 0 }
        tunnels_offline: { type: integer, minimum: 0 }
        connectors_online: { type: integer, minimum: 0 }
        services_total: { type: integer, minimum: 0 }
        services_ready: { type: integer, minimum: 0 }
        services_error: { type: integer, minimum: 0 }
        active_connections: { type: integer, minimum: 0 }
    GatewayCertificate:
      type: object
      additionalProperties: false
      required: [tls_mode, expires_at, remaining_seconds, level, recent_renewal_failed, recent_renewal_error_code]
      description: 由 Server 冻结的 Gateway 叶证书状态；客户端不得重算 level 或解析错误文本。
      properties:
        tls_mode: { type: string, enum: [public, pinned] }
        expires_at: { $ref: '#/components/schemas/DateTime' }
        remaining_seconds: { type: integer, format: int64 }
        level:
          type: string
          enum: [HEALTHY, WARNING, CRITICAL, EMERGENCY, EXPIRED]
          description: 分别表示剩余时间大于 30 天、不超过 30 天、不超过 7 天、不超过 1 天和已过期。
        recent_renewal_failed: { type: boolean }
        recent_renewal_error_code:
          oneOf:
            - { type: string, const: GATEWAY_CERTIFICATE_RENEWAL_FAILED }
            - { type: 'null' }
    RecentError:
      type: object
      additionalProperties: false
      required: [code, message, occurred_at]
      properties:
        code:
          type: string
          enum: [TUNNEL_OFFLINE, CONNECTOR_OFFLINE, ORIGIN_DOWN, NO_CAPACITY, PROTOCOL_ERROR]
          description: M6-05 Dashboard 使用的五类冻结诊断码。
        message: { type: string, minLength: 1 }
        occurred_at: { $ref: '#/components/schemas/DateTime' }
        request_id: { oneOf: [{ $ref: '#/components/schemas/RequestID' }, { type: 'null' }] }
    RecentErrorsSummary:
      type: object
      additionalProperties: false
      required: [availability, items]
      description: M6-05 Error Read Model 就绪后返回 AVAILABLE；没有最近错误时 items 为空。UNAVAILABLE 只表示该 Read Model 尚不可用。
      if:
        properties: { availability: { const: UNAVAILABLE } }
        required: [availability]
      then:
        properties:
          items: { type: array, maxItems: 0 }
      properties:
        availability: { type: string, enum: [AVAILABLE, UNAVAILABLE] }
        items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/RecentError' } }
    Dashboard:
      type: object
      additionalProperties: false
      required: [server_status, counts, traffic, recent_errors, generated_at]
      properties:
        server_status: { type: string, enum: [READY, DEGRADED] }
        counts: { $ref: '#/components/schemas/DashboardCounts' }
        traffic: { $ref: '#/components/schemas/UsageSummary' }
        recent_errors: { $ref: '#/components/schemas/RecentErrorsSummary' }
        gateway_certificate: { $ref: '#/components/schemas/GatewayCertificate' }
        generated_at: { $ref: '#/components/schemas/DateTime' }
    SystemInfo:
      type: object
      additionalProperties: false
      required: [version, go_version, protocol_version, os, arch, started_at, uptime_seconds]
      properties:
        version: { type: string, minLength: 1 }
        go_version: { type: string, minLength: 1 }
        protocol_version: { type: string, const: v1 }
        os: { type: string, minLength: 1 }
        arch: { type: string, minLength: 1 }
        started_at: { $ref: '#/components/schemas/DateTime' }
        uptime_seconds: { type: integer, format: int64, minimum: 0 }
    HealthCheckResult:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name: { type: string, minLength: 1 }
        status: { type: string, enum: [READY, DEGRADED] }
        message: { type: [string, 'null'] }
    SystemHealth:
      type: object
      additionalProperties: false
      required: [status, checks, checked_at]
      properties:
        status: { type: string, enum: [READY, DEGRADED] }
        checks: { type: array, items: { $ref: '#/components/schemas/HealthCheckResult' } }
        checked_at: { $ref: '#/components/schemas/DateTime' }

    SystemConfig:
      type: object
      additionalProperties: false
      required: [management, agent_gateway, tcp_ingress, logging, limits, changes_require_restart]
      properties:
        management:
          type: object
          additionalProperties: false
          required: [public_url]
          properties: { public_url: { type: string, format: uri } }
        agent_gateway:
          type: object
          additionalProperties: false
          required: [public_hostname, tls_mode]
          properties:
            public_hostname: { type: string, minLength: 1 }
            tls_mode: { type: string, enum: [public, pinned] }
        tcp_ingress:
          type: object
          additionalProperties: false
          required: [min_port, max_port]
          properties:
            min_port: { type: integer, minimum: 1, maximum: 65535 }
            max_port: { type: integer, minimum: 1, maximum: 65535 }
        logging:
          type: object
          additionalProperties: false
          required: [level]
          properties: { level: { type: string, enum: [debug, info, warn, error] } }
        limits: { $ref: '#/components/schemas/PublicLimits' }
        changes_require_restart: { type: boolean, const: true }
    PublicLimits:
      type: object
      additionalProperties: false
      required: [max_tunnels, max_connectors, max_connectors_per_tunnel, max_services_per_tunnel, max_active_connections, max_connections_per_tunnel, max_connections_per_service, max_connections_per_source_ip, max_open_rate_per_source_ip, max_open_burst_per_source_ip, max_http_requests_per_source_ip_per_second, max_http_header_bytes, max_http_body_bytes]
      properties:
        max_tunnels: { type: integer, minimum: 1 }
        max_connectors: { type: integer, minimum: 1 }
        max_connectors_per_tunnel: { type: integer, minimum: 1 }
        max_services_per_tunnel: { type: integer, minimum: 1 }
        max_active_connections: { type: integer, minimum: 1 }
        max_connections_per_tunnel: { type: integer, minimum: 1 }
        max_connections_per_service: { type: integer, minimum: 1 }
        max_connections_per_source_ip: { type: integer, minimum: 1 }
        max_open_rate_per_source_ip: { type: integer, minimum: 1 }
        max_open_burst_per_source_ip: { type: integer, minimum: 1 }
        max_http_requests_per_source_ip_per_second: { type: integer, minimum: 1 }
        max_http_header_bytes: { type: integer, minimum: 1 }
        max_http_body_bytes: { type: integer, format: int64, minimum: 1 }

    SecurityAuditAction: { type: string, enum: [GATEWAY_KEY_ROTATE, CONNECTION_TOKEN_REVEAL, CONNECTION_TOKEN_ROTATE, CONNECTION_TOKEN_REVOKE, TUNNEL_REVOKE] }
    SecurityAuditResult: { type: string, enum: [SUCCEEDED, FAILED] }
    SecurityAuditResourceType: { type: string, enum: [GATEWAY_IDENTITY, TUNNEL_TOKEN, TUNNEL] }
    SecurityAuditEvent:
      type: object
      additionalProperties: false
      required: [event_id, operation_id, event, action, actor_type, actor_id, source_ip, resource_type, resource_id, result, error_code, request_id, trace_id, before_state_digest, after_state_digest, occurred_at]
      allOf:
        - if:
            properties: { result: { const: SUCCEEDED } }
            required: [result]
          then:
            properties: { error_code: { type: 'null' } }
        - if:
            properties: { result: { const: FAILED } }
            required: [result]
          then:
            properties: { error_code: { type: string, minLength: 1, maxLength: 64 } }
        - if:
            properties: { actor_type: { const: LOCAL_OPERATOR } }
            required: [actor_type]
          then:
            properties:
              actor_id: { type: 'null' }
              source_ip: { type: 'null' }
        - if:
            properties: { actor_type: { const: ADMIN } }
            required: [actor_type]
          then:
            properties:
              actor_id: { $ref: '#/components/schemas/AdminID' }
        - if:
            properties: { action: { const: GATEWAY_KEY_ROTATE } }
            required: [action]
          then:
            properties:
              actor_type: { const: LOCAL_OPERATOR }
              actor_id: { type: 'null' }
              source_ip: { type: 'null' }
              resource_type: { const: GATEWAY_IDENTITY }
        - if:
            properties:
              action: { enum: [CONNECTION_TOKEN_REVEAL, CONNECTION_TOKEN_ROTATE, CONNECTION_TOKEN_REVOKE] }
            required: [action]
          then:
            properties:
              actor_type: { const: ADMIN }
              actor_id: { $ref: '#/components/schemas/AdminID' }
              resource_type: { const: TUNNEL_TOKEN }
              resource_id: { $ref: '#/components/schemas/TunnelID' }
        - if:
            properties: { action: { const: TUNNEL_REVOKE } }
            required: [action]
          then:
            properties:
              actor_type: { const: ADMIN }
              actor_id: { $ref: '#/components/schemas/AdminID' }
              resource_type: { const: TUNNEL }
              resource_id: { $ref: '#/components/schemas/TunnelID' }
      properties:
        event_id: { $ref: '#/components/schemas/EventID' }
        operation_id: { $ref: '#/components/schemas/OperationID' }
        event: { type: string, const: SECURITY_OPERATION_RESULT }
        action: { $ref: '#/components/schemas/SecurityAuditAction' }
        actor_type: { type: string, enum: [LOCAL_OPERATOR, ADMIN] }
        actor_id: { oneOf: [{ $ref: '#/components/schemas/AdminID' }, { type: 'null' }] }
        source_ip: { type: [string, 'null'], maxLength: 128 }
        resource_type: { $ref: '#/components/schemas/SecurityAuditResourceType' }
        resource_id: { type: string, minLength: 1, maxLength: 256 }
        result: { $ref: '#/components/schemas/SecurityAuditResult' }
        error_code: { type: [string, 'null'], minLength: 1, maxLength: 64 }
        request_id: { type: [string, 'null'], minLength: 1, maxLength: 128 }
        trace_id: { type: [string, 'null'], minLength: 1, maxLength: 128 }
        before_state_digest: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        after_state_digest: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        occurred_at: { $ref: '#/components/schemas/DateTime' }
    SecurityAuditEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SecurityAuditEvent' } }
        next_page_token: { type: string, minLength: 1, maxLength: 4096 }

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties: { error: { $ref: '#/components/schemas/APIError' } }
    SetupRequiredErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          allOf:
            - { $ref: '#/components/schemas/APIError' }
            - type: object
              properties:
                code: { const: SETUP_REQUIRED }
    APIError:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: { $ref: '#/components/schemas/APIErrorCode' }
        message: { type: string, minLength: 1 }
        request_id: { $ref: '#/components/schemas/RequestID' }
        details:
          oneOf:
            - { $ref: '#/components/schemas/FieldViolationsDetails' }
            - { $ref: '#/components/schemas/TunnelInUseDetails' }
            - { $ref: '#/components/schemas/SnapshotLimitDetails' }
            - { $ref: '#/components/schemas/ResourceVersionConflictDetails' }
          discriminator:
            propertyName: type
            mapping:
              FIELD_VIOLATIONS: '#/components/schemas/FieldViolationsDetails'
              TUNNEL_IN_USE: '#/components/schemas/TunnelInUseDetails'
              SNAPSHOT_LIMIT: '#/components/schemas/SnapshotLimitDetails'
              RESOURCE_VERSION_CONFLICT: '#/components/schemas/ResourceVersionConflictDetails'
    APIErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - INVALID_PAGE_TOKEN
        - INVALID_IF_MATCH
        - PRECONDITION_REQUIRED
        - VALIDATION_FAILED
        - AUTHENTICATION_FAILED
        - SESSION_EXPIRED
        - CSRF_INVALID
        - ORIGIN_NOT_ALLOWED
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - RESOURCE_VERSION_CONFLICT
        - TUNNEL_IN_USE
        - TUNNEL_REVOKED
        - CONNECTION_TOKEN_UNAVAILABLE
        - ROUTE_CONFLICT
        - TCP_PORT_UNAVAILABLE
        - TUNNEL_SERVICE_LIMIT
        - SNAPSHOT_TOO_LARGE
        - RATE_LIMITED
        - SETUP_REQUIRED
        - RUNTIME_CONVERGENCE_FAILED
        - INTERNAL_ERROR
    FieldViolation:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1 }
    FieldViolationsDetails:
      type: object
      additionalProperties: false
      required: [type, violations]
      properties:
        type: { type: string, const: FIELD_VIOLATIONS }
        violations: { type: array, minItems: 1, items: { $ref: '#/components/schemas/FieldViolation' } }
    TunnelInUseDetails:
      type: object
      additionalProperties: false
      required: [type, service_count, referencing_service_ids, references_truncated]
      properties:
        type: { type: string, const: TUNNEL_IN_USE }
        service_count: { type: integer, format: int64, minimum: 1 }
        referencing_service_ids: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ServiceID' } }
        references_truncated: { type: boolean }
    SnapshotLimitDetails:
      type: object
      additionalProperties: false
      required: [type, tunnel_id, service_count, snapshot_bytes, configured_limit]
      properties:
        type: { type: string, const: SNAPSHOT_LIMIT }
        tunnel_id: { $ref: '#/components/schemas/TunnelID' }
        service_count: { type: integer, format: int64, minimum: 0 }
        snapshot_bytes: { type: integer, format: int64, minimum: 0 }
        configured_limit: { type: integer, format: int64, minimum: 1 }
    ResourceVersionConflictDetails:
      type: object
      additionalProperties: false
      required: [type, resource_type, resource_id, current_etag]
      properties:
        type: { type: string, const: RESOURCE_VERSION_CONFLICT }
        resource_type: { type: string, enum: [TUNNEL, SERVICE] }
        resource_id:
          oneOf:
            - { $ref: '#/components/schemas/TunnelID' }
            - { $ref: '#/components/schemas/ServiceID' }
        current_etag: { type: string, pattern: '^"[^"\r\n]+"$' }
